<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="road" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <polygon points="0,500 800,500 520,220 280,220" fill="url(#road)"/>
  <!-- Kerb & sidewalk -->
  <polygon points="0,500 150,500 300,220 280,220" fill="#94a3b8"/>
  <polygon points="800,500 650,500 500,220 520,220" fill="#94a3b8"/>
  <!-- Pothole damage -->
  <ellipse cx="400" cy="380" rx="90" ry="40" fill="#1e293b"/>
  <ellipse cx="410" cy="385" rx="70" ry="25" fill="#0f172a"/>
  <path d="M 330 380 Q 360 360 410 375 T 480 390 Q 420 410 350 400 Z" fill="#020617" opacity="0.6"/>
  <!-- Crack lines -->
  <path d="M 320 375 L 270 360 M 475 390 L 530 410 M 430 365 L 450 330" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
  <!-- Warning badge overlay -->
  <rect x="20" y="20" width="220" height="40" rx="8" fill="#ba1a1a" opacity="0.9"/>
  <text x="130" y="45" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#ffffff" text-anchor="middle">Jalan Berlubang Dalam</text>
  <text x="400" y="480" font-family="Arial, sans-serif" font-size="14" fill="#cbd5e1" text-anchor="middle">Dokumentasi Warga - Bandar Lampung</text>
</svg>

