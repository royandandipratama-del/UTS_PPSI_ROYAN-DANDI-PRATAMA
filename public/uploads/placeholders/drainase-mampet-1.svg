<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#e2e8f0"/>
  <!-- Concrete drainage canal -->
  <polygon points="100,500 700,500 620,180 180,180" fill="#64748b"/>
  <!-- Murky stagnant water overflow -->
  <polygon points="120,500 680,500 600,240 200,240" fill="#365314"/>
  <!-- Trash debris clogging water -->
  <circle cx="340" cy="380" r="45" fill="#713f12" opacity="0.8"/>
  <circle cx="430" cy="360" r="35" fill="#451a03" opacity="0.9"/>
  <circle cx="480" cy="410" r="40" fill="#52525b" opacity="0.85"/>
  <rect x="260" y="340" width="70" height="30" rx="6" fill="#3f3f46" transform="rotate(-15 260 340)"/>
  <rect x="20" y="20" width="240" height="40" rx="8" fill="#0284c7" opacity="0.9"/>
  <text x="140" y="45" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#ffffff" text-anchor="middle">Saluran Air / Drainase Mampet</text>
  <text x="400" y="480" font-family="Arial, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Penyumbatan Aliran Menyebabkan Genangan</text>
</svg>

