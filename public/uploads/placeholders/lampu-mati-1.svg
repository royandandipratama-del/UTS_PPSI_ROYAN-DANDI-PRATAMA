<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="nightsky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#nightsky)"/>
  <!-- Road at night -->
  <polygon points="0,500 800,500 480,300 320,300" fill="#1e293b"/>
  <!-- Street lamp pole -->
  <path d="M 240 500 L 240 180 Q 240 120 300 120 L 330 120" stroke="#64748b" stroke-width="12" fill="none"/>
  <rect x="320" y="115" width="40" height="20" rx="4" fill="#475569"/>
  <!-- Broken lamp (dark red bulb / spark) -->
  <circle cx="340" cy="135" r="8" fill="#7f1d1d"/>
  <path d="M 335 145 L 345 155 M 345 145 L 335 155" stroke="#ef4444" stroke-width="3"/>
  <!-- Warning badge overlay -->
  <rect x="20" y="20" width="220" height="40" rx="8" fill="#b45309" opacity="0.9"/>
  <text x="130" y="45" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#ffffff" text-anchor="middle">Lampu Jalan Padam</text>
  <text x="400" y="480" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Area Gelap - Rawan Kecelakaan</text>
</svg>

