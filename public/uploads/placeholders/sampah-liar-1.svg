<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#f1f5f9"/>
  <polygon points="0,500 800,500 600,280 200,280" fill="#cbd5e1"/>
  <!-- Illegal trash heap on roadside -->
  <ellipse cx="400" cy="400" rx="200" ry="80" fill="#78716c"/>
  <path d="M 250 420 Q 320 320 400 300 Q 500 310 560 410 Z" fill="#44403c"/>
  <!-- Plastic bags & boxes in heap -->
  <circle cx="360" cy="380" r="30" fill="#ef4444" opacity="0.9"/>
  <circle cx="440" cy="370" r="28" fill="#3b82f6" opacity="0.9"/>
  <circle cx="400" cy="350" r="25" fill="#eab308" opacity="0.9"/>
  <rect x="310" y="390" width="60" height="40" fill="#d97706" rx="4"/>
  <rect x="430" y="390" width="50" height="35" fill="#10b981" rx="4"/>
  <!-- Sties / Flies dots -->
  <circle cx="380" cy="280" r="3" fill="#1c1917"/>
  <circle cx="420" cy="270" r="2.5" fill="#1c1917"/>
  <circle cx="400" cy="260" r="3" fill="#1c1917"/>
  <!-- Warning badge overlay -->
  <rect x="20" y="20" width="220" height="40" rx="8" fill="#d97706" opacity="0.9"/>
  <text x="130" y="45" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#ffffff" text-anchor="middle">Tumpukan Sampah Liar</text>
  <text x="400" y="480" font-family="Arial, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Bahu Jalan Terhalang - Bau Menyengat</text>
</svg>

